name: YaVieneWeb CI

on:
  # Solo main: la web se trabaja en main, y `prueba` aquí solo servía para
  # que un mismo commit empujado a las dos ramas se probara dos veces.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# El token de la corrida se le presta a código de terceros, así que va con lo
# mínimo: ningún job de aquí escribe en el repositorio. Sin este bloque iba
# con los permisos por omisión, que incluyen escritura.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama mientras la corrida anterior
# sigue, la vieja se cancela: su resultado ya no le importa a nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cada acción va clavada al commit y no a la etiqueta: una etiqueta se mueve
# sin avisar y con ella cambia el código de terceros que corre con ese token.
# La versión legible queda al lado; para subir una se resuelve la etiqueta con
# `gh api repos/DUEÑO/ACCION/commits/ETIQUETA --jq .sha` y se cambian el SHA y
# el comentario en el mismo commit. Las elegidas corren en Node 24: GitHub
# quita Node 20 de sus runners el 16 de septiembre de 2026 y las @v4 dejan de
# arrancar.
jobs:
  # Barrido de secretos (T3.12). gitleaks-action revisa los commits del push
  # o del PR, no el árbol: no tiene modo sin git. Necesita el historial
  # completo para ver lo que entró en cualquier commit del rango.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Todas las dependencias de la web son de desarrollo, pero no por eso
      # inocuas: Vite sirve la página en local y arma la build que se sube.
      # Una vulnerabilidad alta o crítica en cualquiera de ellas tumba la CI.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Las mismas pruebas de humo, más el trinquete de cobertura (T8.7):
      # los umbrales están en `vite.config.ts`, son la cobertura del día que
      # se puso y sólo suben.
      - name: Tests de humo con cobertura
        run: npm run test:cobertura

      - name: Build
        run: npm run build

      # El peso de una página se va de las manos de a poco: una fuente
      # aquí, una librería allá. Esto falla en cuanto la build se pasa de
      # los topes, así que el commit que la engordó queda señalado.
      - name: Presupuesto de peso
        run: npm run presupuesto

      # Chromium tarda en bajar, así que se guarda en caché entre
      # ejecuciones y sólo se vuelve a descargar si cambia la versión de
      # Playwright que hay en el package-lock.
      - name: Caché de Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache-navegador
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Un navegador de verdad abriendo las cuatro páginas en móvil y en
      # escritorio: errores de consola, peticiones colgando, desbordes
      # laterales y el esqueleto accesible. Son los fallos que no se ven
      # leyendo el código.
      - name: Pruebas de navegador
        run: npm run test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        # upload-artifact@v5 todavía corre en Node 20; la primera en Node 24
        # es la v6.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: informe-playwright
          # En la CI el informe es el de GitHub y no deja carpeta: lo que
          # explica un fallo son las trazas de test-results/.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

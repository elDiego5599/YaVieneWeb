name: YaVieneWeb CI

on:
  push:
    branches: [main, prueba]
  pull_request:
    branches: [main]

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests de humo
        run: npm test

      - name: Build
        run: npm run build
